# A generic, single database configuration.

[alembic]
# path to migration scripts
script_location = alembic

# template used to generate migration file names
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# timezone for the file_template
timezone = UTC

# max length of characters to apply to the slug field
truncate_slug_length = 40

# version path separator
version_path_separator = os

# the output encoding used when revision files are written from script.py.mako
output_encoding = utf-8

# NOTE: The actual DB URL is read from env in alembic/env.py;
# this placeholder keeps Alembic happy when no -x flag is passed.
sqlalchemy.url = driver://user:pass@localhost/dbname

[post_write_hooks]
# Uncomment to run ruff format on new migration files:
# hooks = ruff-format
# ruff-format.type = exec
# ruff-format.executable = %(here)s/../.venv/bin/ruff
# ruff-format.options = format REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
